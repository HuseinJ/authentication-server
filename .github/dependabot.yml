version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait after a release before proposing it; security updates bypass this
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    groups:
      gradle-minor-and-patch:
        update-types: [ "minor", "patch" ]
      gradle-major:
        update-types: [ "major" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait after a release before proposing it; security updates bypass this
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      github-actions:
        patterns: [ "*" ]

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait after a release before proposing it; security updates bypass this
    cooldown:
      default-days: 7
      semver-major-days: 14
